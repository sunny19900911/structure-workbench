# 放入 smarter-xuan.xyz 现有 server 块，仅替换旧 /work 相关 location。
# 保留主站 location /。不要把本文件当完整站点配置。
# proxy_pass 末尾不加 /，保留 /work/ 前缀，后端按 deployment.json 处理。
location = /work {
    return 308 /work/$is_args$args;
}
location ^~ /work/ {
    proxy_pass http://127.0.0.1:5190;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 80m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 480s;
    proxy_send_timeout 480s;
    proxy_buffering off;
    proxy_cache off;
}
